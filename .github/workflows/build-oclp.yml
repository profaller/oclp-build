name: Build OCLP EFI for MacBookPro11,5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout OCLP 2.5.1
        uses: actions/checkout@v4
        with:
          repository: dortania/OpenCore-Legacy-Patcher
          ref: "2.5.1"
          path: OCLP

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: OCLP
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Download official OCLP package
        run: |
          curl -fL \
            "https://github.com/dortania/OpenCore-Legacy-Patcher/releases/download/2.5.1/OpenCore-Patcher.pkg" \
            -o /tmp/OpenCore-Patcher.pkg

      - name: Install official OCLP package
        run: |
          sudo installer \
            -pkg /tmp/OpenCore-Patcher.pkg \
            -target /

      - name: Find installed OCLP resources
        run: |
          echo "=== Installed application ==="
          find "/Library/Application Support" \
            -name "OpenCore-Patcher.app" \
            -print 2>/dev/null || true

          echo "=== Resource DMGs ==="
          find "/Library/Application Support" \
            \( -name "payloads.dmg" -o -name "Universal-Binaries.dmg" \) \
            -print 2>/dev/null || true

      - name: Copy binary resources into source tree
        run: |
          APP="/Library/Application Support/Dortania/OpenCore-Patcher.app"

          echo "=== OCLP app contents ==="
          find "$APP/Contents" -maxdepth 4 \
            \( -name "payloads.dmg" -o -name "Universal-Binaries.dmg" \) \
            -print

          PAYLOADS="$(find "$APP/Contents" \
            -type f \
            -name "payloads.dmg" \
            -print -quit)"

          UNIVERSAL="$(find "$APP/Contents" \
            -type f \
            -name "Universal-Binaries.dmg" \
            -print -quit)"

          echo "payloads.dmg: $PAYLOADS"
          echo "Universal-Binaries.dmg: $UNIVERSAL"

          if [ -z "$PAYLOADS" ]; then
            echo "ERROR: payloads.dmg not found"
            exit 1
          fi

          if [ -z "$UNIVERSAL" ]; then
            echo "ERROR: Universal-Binaries.dmg not found"
            exit 1
          fi

          cp "$PAYLOADS" OCLP/payloads.dmg
          cp "$UNIVERSAL" OCLP/Universal-Binaries.dmg

          echo "=== Copied resources ==="
          ls -lh OCLP/payloads.dmg
          ls -lh OCLP/Universal-Binaries.dmg
          
      - name: Build OpenCore for MacBookPro11,5
        working-directory: OCLP
        run: |
          python3 OpenCore-Patcher-GUI.command \
            --build \
            --model MacBookPro11,5 \
            --verbose

      - name: Show resulting build tree
        working-directory: OCLP
        run: |
          echo "=== Build-Folder ==="
          find Build-Folder -maxdepth 5 -print || true

      - name: Verify EFI
        working-directory: OCLP
        run: |
          echo "Checking EFI..."

          test -f Build-Folder/OpenCore-Build/EFI/OC/OpenCore.efi
          echo "OpenCore.efi OK"

          test -f Build-Folder/OpenCore-Build/EFI/OC/config.plist
          echo "config.plist OK"

          test -f Build-Folder/OpenCore-Build/EFI/BOOT/BOOTx64.efi
          echo "BOOTx64.efi OK"

      - name: Upload EFI
        uses: actions/upload-artifact@v4
        with:
          name: OCLP-MacBookPro11-5-EFI
          path: OCLP/Build-Folder/OpenCore-Build/EFI
          if-no-files-found: error
