name: Build OCLP EFI for MacBookPro11,5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout OCLP 2.5.1
        uses: actions/checkout@v4
        with:
          repository: dortania/OpenCore-Legacy-Patcher
          ref: "2.5.1"
          path: OCLP

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: OCLP
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Build OpenCore for MacBookPro11,5
        working-directory: OCLP
        run: |
          python3 OpenCore-Patcher-GUI.command \
            --build \
            --model MacBookPro11,5 \
            --verbose

      - name: Show build result
        working-directory: OCLP
        run: |
          echo "=== Build-Folder ==="
          find Build-Folder -maxdepth 4 -type f | sort

          echo
          echo "=== EFI directory ==="
          find Build-Folder/OpenCore-Build/EFI -maxdepth 4 -type f | sort

      - name: Verify EFI
        working-directory: OCLP
        run: |
          test -f Build-Folder/OpenCore-Build/EFI/OC/OpenCore.efi
          test -f Build-Folder/OpenCore-Build/EFI/OC/config.plist
          test -f Build-Folder/OpenCore-Build/EFI/BOOT/BOOTx64.efi

          echo "EFI looks good"

      - name: Upload EFI
        uses: actions/upload-artifact@v4
        with:
          name: OCLP-MacBookPro11-5-EFI
          path: OCLP/Build-Folder/OpenCore-Build/EFI
          if-no-files-found: error
